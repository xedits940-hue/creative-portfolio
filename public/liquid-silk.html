<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Liquid Silk Background</title>
  <style>
    /* =====================================================================
       RESET & BASE CANVAS STYLING
       ===================================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #050505;
      min-height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* 1. Fallback Gradient (WebGL लोड होने से पहले या धीमे डिवाइस के लिए) */
    .ls-fallback {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(130% 80% at 50% -14%, rgba(179, 19, 46, 0.55), transparent 55%),
        radial-gradient(100% 66% at 72% 118%, rgba(232, 212, 176, 0.34), transparent 60%),
        radial-gradient(120% 120% at 50% 45%, #0b0708, #050505 72%),
        #050505;
    }

    /* 2. WebGL Liquid Silk Canvas (मुख्य फ्लुइड सिल्क एनिमेशन) */
    .ls-canvas {
      position: fixed;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* 3. Subtle Film Grain (सिनेमैटिक टेक्सचर) */
    .ls-grain {
      position: fixed;
      inset: -50%;
      z-index: 2;
      pointer-events: none;
      opacity: 0.045;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.55'/%3E%3C/svg%3E");
      background-size: 220px 220px;
      animation: lsGrain 0.8s steps(4) infinite;
    }

    @keyframes lsGrain {
      0% { transform: translate(0, 0); }
      25% { transform: translate(-2%, 1%); }
      50% { transform: translate(1%, -2%); }
      75% { transform: translate(-1%, -1%); }
      100% { transform: translate(2%, 2%); }
    }

    /* 4. Radial Vignette (किनारों पर डार्क शेडो) */
    .ls-vig {
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      background: radial-gradient(
        circle at 50% 46%,
        transparent 45%,
        rgba(0, 0, 0, 0.25) 75%,
        rgba(0, 0, 0, 0.65) 100%
      );
    }
  </style>
</head>
<body>

  <!-- Layer 1: Fallback Gradient -->
  <div class="ls-fallback"></div>

  <!-- Layer 2: WebGL Fluid Canvas -->
  <canvas class="ls-canvas" id="lsCanvas"></canvas>

  <!-- Layer 3: Noise Film Grain -->
  <div class="ls-grain"></div>

  <!-- Layer 4: Vignette Glow/Shadow -->
  <div class="ls-vig"></div>

  <!-- JavaScript: WebGL Shader Engine with Mouse Interactivity -->
  <script>
    (function initLiquidSilk() {
      const cvs = document.getElementById("lsCanvas");
      if (!cvs) return;

      const coarse = window.matchMedia("(pointer:coarse)").matches;
      let gl = null;

      try {
        gl = cvs.getContext("webgl", {
          alpha: true,
          antialias: false,
          premultipliedAlpha: false,
          powerPreference: "high-performance"
        });
      } catch (e) {
        console.warn("WebGL initialization error:", e);
      }

      if (!gl) {
        cvs.style.display = "none";
        return;
      }

      // Vertex Shader
      const VS = `
        attribute vec2 p;
        void main() {
          gl_Position = vec4(p, 0.0, 1.0);
        }
      `;

      // Fragment Shader (FBM Fluid Silk + Dynamic Color Palette + ACES Tone Mapping)
      const FS = `
        precision highp float;
        uniform vec2 uRes;
        uniform float uT;
        uniform vec2 uM;

        float hash(vec2 p) {
          return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
        }

        float noise(vec2 p) {
          vec2 i = floor(p), f = fract(p);
          vec2 u = f * f * (3.0 - 2.0 * f);
          return mix(
            mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x),
            mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x),
            u.y
          );
        }

        float fbm(vec2 p) {
          float v = 0.0, a = 0.5;
          mat2 m = mat2(0.8, 0.6, -0.6, 0.8);
          for (int i = 0; i < 6; i++) {
            v += a * noise(p);
            p = m * p * 2.02 + vec2(19.3, 7.7);
            a *= 0.5;
          }
          return v;
        }

        vec3 aces(vec3 x) {
          return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0);
        }

        void main() {
          vec2 uv = gl_FragCoord.xy / uRes.xy;
          vec2 p = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y;
          float t = uT * 0.06;

          // Mouse wave distortion
          p += (uM - 0.5) * 0.10;

          vec2 q = vec2(fbm(p * 1.4 + vec2(0.0, t)), fbm(p * 1.4 + vec2(5.2, -t)));
          vec2 r = vec2(fbm(p * 1.4 + q * 1.8 + vec2(1.7, 9.2) + t * 0.7), fbm(p * 1.4 + q * 1.8 + vec2(8.3, 2.8) - t * 0.7));
          float f = fbm(p * 1.4 + r * 2.2);
          f = pow(clamp(f, 0.0, 1.0), 1.25);
          float flow = length(q) * 0.6 + length(r) * 0.4;

          vec3 black   = vec3(0.020, 0.018, 0.020);
          vec3 crimson = vec3(0.470, 0.075, 0.120);
          vec3 red     = vec3(1.000, 0.176, 0.278);
          vec3 champ   = vec3(0.910, 0.830, 0.690);
          vec3 pink    = vec3(1.000, 0.372, 0.431);

          float topRed   = smoothstep(0.75, -0.15, uv.y);
          float botChamp = smoothstep(0.15, 0.95, 1.0 - uv.y) * smoothstep(0.15, 0.9, uv.x);

          vec3 col = black;
          col = mix(col, crimson, f * 0.85);
          col = mix(col, red,     f * topRed * 0.75);
          col = mix(col, pink,    flow * topRed * 0.25);
          col = mix(col, champ,   botChamp * (0.2 + 0.4 * f));

          float veins = smoothstep(0.55, 0.9, f) * topRed;
          col += red * veins * 0.5;
          col += champ * smoothstep(0.6, 0.95, flow) * botChamp * 0.25;
          col += crimson * smoothstep(0.6, -0.2, uv.y) * 0.25;

          col = aces(col * 1.0);
          col *= mix(0.35, 1.0, smoothstep(1.5, 0.15, length(p * vec2(1.0, 1.15))));

          gl_FragColor = vec4(col, 1.0);
        }
      `;

      function createShader(type, source) {
        const s = gl.createShader(type);
        gl.shaderSource(s, source);
        gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
          console.warn(gl.getShaderInfoLog(s));
          return null;
        }
        return s;
      }

      const vShader = createShader(gl.VERTEX_SHADER, VS);
      const fShader = createShader(gl.FRAGMENT_SHADER, FS);

      if (!vShader || !fShader) {
        cvs.style.display = "none";
        return;
      }

      const prog = gl.createProgram();
      gl.attachShader(prog, vShader);
      gl.attachShader(prog, fShader);
      gl.linkProgram(prog);

      if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
        cvs.style.display = "none";
        return;
      }

      gl.useProgram(prog);

      const buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);

      const loc = gl.getAttribLocation(prog, "p");
      gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

      const uRes = gl.getUniformLocation(prog, "uRes");
      const uT = gl.getUniformLocation(prog, "uT");
      const uM = gl.getUniformLocation(prog, "uM");

      let isLowPower = (navigator.hardwareConcurrency || 4) <= 4;
      let dpr = Math.min(window.devicePixelRatio || 1, isLowPower ? 1.5 : 2.5);
      let quality = isLowPower ? 0.75 : 1;

      function resize() {
        if (!cvs) return;
        const w = Math.floor(window.innerWidth * dpr * quality);
        const h = Math.floor(window.innerHeight * dpr * quality);
        if (cvs.width !== w || cvs.height !== h) {
          cvs.width = w;
          cvs.height = h;
          gl.viewport(0, 0, w, h);
        }
      }

      resize();
      window.addEventListener("resize", resize, { passive: true });

      // Smooth mouse follow
      let mx = 0.5;
      let my = 0.5;
      let tmx = 0.5;
      let tmy = 0.5;

      function onMove(e) {
        tmx = e.clientX / window.innerWidth;
        tmy = 1.0 - e.clientY / window.innerHeight;
      }

      if (!coarse) {
        window.addEventListener("pointermove", onMove, { passive: true });
      }

      const start = performance.now();
      let last = start;
      let ftAvg = 16;
      let degraded = false;
      let rafId;

      // 60FPS Render Loop with auto-performance scaling
      function frame(now) {
        rafId = requestAnimationFrame(frame);
        ftAvg += ((now - last) - ftAvg) * 0.05;
        last = now;

        if (!degraded && ftAvg > 26) {
          quality = 0.85;
          resize();
          degraded = true;
        }

        mx += (tmx - mx) * 0.05;
        my += (tmy - my) * 0.05;

        gl.uniform2f(uRes, cvs.width, cvs.height);
        gl.uniform1f(uT, (now - start) / 1000.0);
        gl.uniform2f(uM, mx, my);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
      }

      rafId = requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
